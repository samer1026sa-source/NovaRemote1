name: Build Nova Remote iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Capacitor project
        run: |
          mkdir web
          cp index.html web/
          cp style.css web/
          cp script.js web/

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios

          npx cap init "Nova Remote" "com.novaremote.app" --web-dir=web
          npx cap add ios

      - name: Build iOS app
        run: |
          cd ios/App

          xcodebuild \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p Payload

          cp -R \
          ios/App/build/Build/Products/Release-iphoneos/App.app \
          Payload/

          zip -r NovaRemote.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NovaRemote-iPhone
          path: NovaRemote.ipa
